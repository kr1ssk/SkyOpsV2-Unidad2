version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci
  pre_build:
    commands:
      - CI=true npm run test:ci -- --runInBand
  build:
    commands:
      - npm run build
artifacts:
  files:
    - "**/*"
  base-directory: build
# Jasmine/Karma y sus evidencias se ejecutan en GitHub Actions con Chrome.
